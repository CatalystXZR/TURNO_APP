workflows:
  ios-build:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - prod
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: v*.*.*
          include: true
    scripts:
      - name: Install dependencies
        working_directory: turnoapp
        script: flutter pub get
      - name: Static analysis
        working_directory: turnoapp
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        working_directory: turnoapp
        script: flutter test
        ignore_failure: true
      - name: Set up Apple Code Signing
        working_directory: turnoapp
        script: |
          keychain initialize
          
          # 1. Decodifica tu llave de App Store Connect (.p8)
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_key.p8"
          
          # 2. Deja que Codemagic descargue el perfil oficial de TestFlight
          app-store-connect fetch-signing-files "com.uniride.turnoapp" --create --private-key="$HOME/private_key.p8"
          
          # 3. Decodifica tu certificado .p12 generado en Fedora con -legacy
          echo "$CM_CERTIFICATE" | base64 --decode > "$HOME/distribution.p12"
          
          # 4. Deja que Codemagic instale y configure los permisos de firmado correctamente
          keychain add-certificates --certificates "$HOME/distribution.p12" --password "$CM_CERTIFICATE_PASSWORD"
      - name: Build iOS IPA
        working_directory: turnoapp
        script: |
          # 5. Compilamos el IPA indicandole a Xcode que use la firma automatica de Codemagic
          flutter build ipa --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - turnoapp/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testers Internos
