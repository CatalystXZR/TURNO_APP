workflows:
  ios-build:
    name: Build iOS IPA & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - prod
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: v*.*.*
          include: true
    scripts:
      - name: Install dependencies
        working_directory: turnoapp
        script: flutter pub get
      - name: Static analysis
        working_directory: turnoapp
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        working_directory: turnoapp
        script: flutter test
        ignore_failure: true
      - name: Set up Apple Code Signing
        working_directory: turnoapp
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.uniride.turnoapp" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        working_directory: turnoapp
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - turnoapp/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testers Internos
