workflows:
  ios-build:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - prod
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: v*.*.*
          include: true
    scripts:
      - name: Install dependencies
        working_directory: turnoapp
        script: flutter pub get
      - name: Static analysis
        working_directory: turnoapp
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        working_directory: turnoapp
        script: flutter test
        ignore_failure: true
      - name: Set up Apple Code Signing
        working_directory: turnoapp
        script: |
          keychain initialize
          
          # 1. Decodifica tu .p8 sin corromperlo usando printf
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$HOME/private_key.p8"
          
          # 2. Descarga los perfiles de Apple de forma oficial
          app-store-connect fetch-signing-files "com.uniride.turnoapp" --create --private-key="$HOME/private_key.p8"
          
          # 3. Crea la carpeta oficial de certificados de la Mac
          mkdir -p "$HOME/Library/MobileDevice/Certificates"
          
          # 4. Decodifica tu verdadero .p12 (el que uniste en Fedora) directo a la carpeta de escaneo
          printf "%s" "$CM_CERTIFICATE" | base64 --decode > "$HOME/Library/MobileDevice/Certificates/distribution.p12"
          
          # 5. Instala el certificado en el llavero de forma nativa
          keychain add-certificates
      - name: Build iOS IPA
        working_directory: turnoapp
        script: |
          flutter build ipa --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - turnoapp/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testers Internos
